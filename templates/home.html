
{% extends "base.html" %}


{% block title %}Base 101{% endblock %}


{% block content %}

	<section class="hero">

	{% if session.get("user") %}
	<section class="login-box">
		<h1> Welcome to VideoApp, {{ session["user"] }}! </h1>
		<a class="button" href="/cards">Go to cards</a>
	</section>
	{% else %}
	<section class= "login-box">
		<h1> Cards Ready set Go </h1>
		<br><br>
		<div class="hero-buttons">
			<a class="button" href="/register">Create Account</a>
			<a class="button secondary" href="/login">  Login</a>
		</div>
	</section>
	{% endif %}

	</section>

<!--<button id="test-button">Test JS</button>-->

{% endblock %}
