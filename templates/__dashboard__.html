{% extends "base.html" %}
{% block content %}

<div class="cards-page">
	<div class="dashboard-actions">
		<a class="dashboard-button" href="{{ url_for('all_cards') }}">Show all my Cards</a>
		<a class="dashboard-button" href="{{ url_for('my_sets') }}">View My Sets</a>
	</div>
	<form class="card-search" action="{{ url_for('search_cards') }}" method="GET">
		<label for="q">Menu:</label>
		<input type="search" id="q" name="q" placeholder="Search ..">
			<button class="remove-set-button" type="submit">
				Search for string
			</button>
	</form>
</div>

{% endblock %}
