
	{% extends "base.html" %}

	{% block content %}
	
	{% if card_set is defined and card_set %}
		<h2>Add a Card to {{ card_set.name }}</h2>
	{% else %}
		<h2>Create a Card</h2>
	{% endif %}
	<div class="login-box">
		<h2>Create a Flashcard</h2>

		<form method="POST">
			<label for="question">Question</label>
			<input
					type="text"
					id="question"
					name="question"
					placeholder="Enter your question"
					required
					>
			<label for="answer">Answer</label>
			<textarea
					id="answer"
					name="answer"
					placeholder="Enter your answer"
					row="5"
					required
					></textarea>
			<button type="submit">Save Flashcard</button>
	
		</form>
	</div>

	{% endblock %}
