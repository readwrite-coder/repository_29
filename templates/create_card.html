
	{% extends "base.html" %}

	{% block content %}

	<div class="login-box">
		<h2>Create a Flashcard</h2>

		<form method="POST" action ="{{ url_for('create_card') }}">
			<label for="question">Question</label>
			<input
					type="text"
					id="question"
					name="question"
					placeholder="Enter your question"
					required
					>
			<label for="answer">Answer</label>
			<textarea
					id="answer"
					name="answer"
					placeholder="Enter your answer"
					row="5"
					required
					></textarea>
			<button type="submit">Save Flashcard</button>
	
		</form>
	</div>

	{% endblock %}
