{% extends "base.html" %}

{% block title %}Create a Set{% endblock %}

{% block content %}

<div class="login-box">

	<h1>Create a Flashcard Set</h1>

	{% if error %}
		<p class="error-message"> {{ error }}</p>
	{% endif %}

	<form 
		method="POST"
		action="{{ url_for('create_set') }}"
		>

		<label for="name">Set name</label>
		<input 
		       	type="text"
	      		id="name" 
		        name="name"
			placeholder="e.g. Python Basics"
			maxlength="100"
			required
			>

		<button type="submit">Create Set</button>
		
	</form>
	
	<p>
	<a href="{{ url_for('my_sets') }}">cancel</a>
	</p>

</div>	
{%endblock%}
