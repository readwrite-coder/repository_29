{% extends "base.html" %}

{% block content %}

<div class="cards-page">
	
	<h1>[ {{ session["user"] }} ]</h1>
	<p>user id : [ {{ session["user_id"] }}]</p>

	<div class="dashboard-actions">
		
		<a class="dashboard-button" href="{{ url_for('all_cards') }}">Show All Cards</a>
		<a class="dashboard-button" href="{{ url_for('create_set') }}">Create Set</a>
		<a class="dashboard-button" href="{{ url_for('my_sets') }}">View My Sets</a>

	</div>
	
	<form >
		<label>Search my cards</label>
		<input
			type="search"
			id="q"
			name="q"
			placeholder="Search questions and answers..."
		>
		<button type="submit">Search</button>
	</form>
</div>

{% endblock %}
