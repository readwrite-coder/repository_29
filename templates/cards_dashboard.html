{% extends "base.html" %}

{% block content %}

<div class="cards-page">
	
	<h1>My Flashcards</h1>
	<p>What would you like to do?</p>

	<div class="dashboard-actions">
		
		<a class="dashboard-button" href="{{ url_for('all_cards') }}">Show All Cards</a>
		<a class="dashboard-button" href="{{ url_for('create_set') }}">Create Set</a>
		<a class="dashboard-button" href="{{ url_for('my_sets') }}">View My Sets</a>

	</div>
	
	<form 
		action="{{ url_for('search_cards') }}"
		method="GET"
		class="card-search"
	>
		<label for="q">Search all my cards</label>
		<input
			type="search"
			id="q"
			name="q"
			placeholder="Free  questions and answers..."
		>

		<button type="submit" class="remove-set-button">Search</button>
	</form>
</div>

{% endblock %}
