{% extends "base.html" %}

{% block title %}My Sets | My Flash Cards{% endblock %}

{% block content %}

<div class="cards-page">
	<h1>My Sets</h1>
	<a class="create-button"
	   href="{{ url_for('create_set') }}">
		+ Create a Set
	</a>

	{% for card_set in sets %}
		<p>

		<a href="{{ url_for("view_set", set_id=card_set.id) }}">
				{{ card_set.name }}
			
		</a>
			-- [{{ card_set.cards|length }} cards]

		</p>
	{% else %}
		<p>You haven't created any sets yet.</p>
	{% endfor %}

</div>

{% endblock %}
